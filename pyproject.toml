[project]
name = "parallax-runta"
version = "0.1.0"
description = "Generate ParallaxEngine games on Runta."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["runta-sdk==0.2.6", "httpx>=0.28,<1"]

[project.scripts]
pxr = "pxr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pxr"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
